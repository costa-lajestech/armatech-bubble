<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LajesTech — Vãos Irregulares (Comprimento de Vigotas)</title>
<!--
  ════════════════════════════════════════════════════════════════════
  MÓDULO DE SUPORTE — VÃOS IRREGULARES (LajesTech)
  Objetivo: descobrir o comprimento de CADA vigota quando o ambiente
  não é retangular (trapézio, triângulo, em L) ou totalmente irregular
  (modo "Medições").

  INTEGRAÇÃO COM O BUBBLE
  -----------------------
  Este arquivo roda dentro de um elemento HTML do Bubble (iframe).
  Ao clicar em "Enviar pro orçamento", ele dispara:

      window.parent.postMessage({ source:'lajestech_vaos', payload:{...} }, '*')

  No Bubble, capture com um plugin de listener (ex.: "JS to Bubble" do
  Toolbox) ouvindo a mensagem e lendo event.data.payload. Estrutura do
  payload documentada na função enviarBubble() lá embaixo.
  ════════════════════════════════════════════════════════════════════
-->
<style>
  :root {
    --pr:#14bdeb; --pr-bg:#EBF9FD; --pr-dark:#0e84a4;
    --bl:#063846; --bl-bg:#E0F4FA;
    --su:#0a5e75; --su-bg:#E0F4FA;
    --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB;
    --g400:#9CA3AF; --g600:#6B7280; --g800:#1F2937;
    --white:#fff; --red:#DC2626; --amber:#B45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g100);color:var(--g800);overflow:hidden}
  .hdr{height:52px;background:#021217;border-bottom:2px solid #14bdeb;display:flex;align-items:center;padding:0 16px;gap:12px}
  .hdr-dot{display:none}
  .hdr-logo{display:flex;align-items:center;gap:8px}
  .hdr-logo-icon{width:28px;height:28px;flex-shrink:0}
  .hdr-logo-text{font-size:15px;font-weight:800;letter-spacing:.04em;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .hdr-logo-text span{color:#14bdeb}
  .hdr-divider{width:1px;height:22px;background:#0a5e75;margin:0 4px}
  .hdr-title{font-size:12px;font-weight:600;color:#84d9f0}
  .hdr-sub{font-size:11px;color:#0a5e75}
  .hdr-spacer{flex:1}
  .hdr-btn{font-size:12px;font-weight:600;border:1.5px solid #0a5e75;background:transparent;color:#84d9f0;border-radius:7px;padding:6px 11px;cursor:pointer;transition:all .12s}
  .hdr-btn:hover{border-color:#14bdeb;color:#14bdeb}
  .hdr-btn.primary{background:#14bdeb;border-color:#14bdeb;color:#021217;font-weight:700}
  .hdr-btn.primary:hover{background:#0e84a4;border-color:#0e84a4}
  .tabs{height:42px;background:var(--white);border-bottom:1px solid var(--g200);display:flex;align-items:center;padding:0 12px;gap:3px}
  .tab{padding:5px 13px;border-radius:6px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--g600);transition:all .12s}
  .tab:hover{background:var(--g100)}
  .tab.on{background:var(--pr-bg);color:var(--pr);font-weight:600}
  .main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 88px)}
  .left{background:var(--white);border-right:1px solid var(--g200);overflow-y:auto;padding:14px}
  .sec-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g400);margin-bottom:8px;margin-top:2px}
  .fg{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
  .fl{font-size:12px;font-weight:500;color:var(--g600)}
  .fr{display:flex;align-items:center;gap:6px}
  .fi{flex:1;padding:7px 9px;border:1.5px solid var(--g200);border-radius:7px;font-size:14px;outline:none;transition:border .12s;width:100%}
  .fi:focus{border-color:var(--pr)}
  .fu{font-size:11px;color:var(--g400);white-space:nowrap}
  .hint{font-size:10px;color:var(--g400);margin-top:2px}
  .err{font-size:11px;color:var(--red);display:none;margin-top:2px}
  .err.on{display:block}
  .div{height:1px;background:var(--g100);margin:4px -14px 12px}
  .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
  .sc{border:1.5px solid var(--g200);border-radius:7px;padding:7px 4px 6px;cursor:pointer;text-align:center;transition:all .12s}
  .sc:hover,.sc.on{border-color:var(--pr);background:var(--pr-bg)}
  .sc svg{display:block;margin:0 auto 4px}
  .sc span{font-size:10px;color:var(--g600);display:block;line-height:1.2}
  .sc.on span{color:var(--pr);font-weight:600}
  .tg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:9px}
  .tb{padding:6px 2px;border:1.5px solid var(--g200);border-radius:6px;background:none;font-size:12px;font-weight:500;cursor:pointer;color:var(--g600);transition:all .12s}
  .tb:hover,.tb.on{border-color:var(--bl);background:var(--bl-bg);color:var(--bl)}
  .ench-toggle{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
  .et{padding:6px 4px;border:1.5px solid var(--g200);border-radius:6px;background:none;font-size:12px;font-weight:500;cursor:pointer;color:var(--g600);transition:all .12s;text-align:center}
  .et:hover,.et.on{border-color:var(--su);background:var(--su-bg);color:var(--su)}
  .ie-box{background:linear-gradient(135deg,#EBF9FD,#D0F1FA);border:1.5px solid var(--pr);border-radius:8px;padding:10px 12px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
  .ie-label{font-size:11px;color:var(--pr-dark);font-weight:600}
  .ie-val{font-size:20px;font-weight:800;color:var(--pr);line-height:1}
  .ie-unit{font-size:11px;color:var(--pr-dark);margin-top:1px}
  .mod-diag{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:10px 12px;margin-bottom:10px}
  .mod-diag-title{font-size:10px;color:var(--g400);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
  .lb{border:1.5px solid var(--g200);border-radius:8px;padding:10px;margin-bottom:9px}
  .lb-title{font-size:11px;font-weight:700;color:var(--bl);margin-bottom:8px}
  .tip{font-size:11px;color:var(--g400);background:var(--g50);border-radius:6px;padding:7px 9px;margin-bottom:6px;line-height:1.5}
  textarea.fi{font-family:inherit;resize:vertical;min-height:84px;line-height:1.6}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0}
  .switch .fl{font-size:12px}
  .sw{position:relative;width:38px;height:22px;flex-shrink:0;border-radius:20px;background:var(--g200);cursor:pointer;transition:background .15s}
  .sw.on{background:var(--pr)}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on::after{left:18px}
  .right{display:grid;grid-template-rows:1fr auto;min-height:0;background:var(--g50)}
  .cvarea{display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  canvas{border-radius:8px;background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:100%;max-height:100%}
  .res{background:var(--white);border-top:1px solid var(--g200);padding:12px 16px;min-height:120px;max-height:300px;overflow-y:auto}
  .res-empty{text-align:center;color:var(--g400);font-size:13px;padding:26px 0}
  .res-kpis{display:flex;gap:20px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap}
  .kpi-v{font-size:22px;font-weight:800;color:var(--pr);line-height:1}
  .kpi-v.bl{color:var(--bl)} .kpi-v.su{color:var(--su)} .kpi-v.g{color:var(--g800)}
  .kpi-l{font-size:10px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .warn{display:flex;align-items:flex-start;gap:7px;font-size:12px;border-radius:7px;padding:7px 10px;margin-bottom:8px;line-height:1.45}
  .warn.amber{background:#FEF3C7;color:var(--amber)}
  .warn.red{background:#FEE2E2;color:var(--red)}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.res-grid{grid-template-columns:1fr}}
  .blk-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--g400);margin-bottom:7px}
  .cuts{display:flex;flex-wrap:wrap;gap:6px}
  .cut{display:flex;flex-direction:column;gap:3px;border:1.5px solid;border-radius:7px;padding:6px 10px;min-width:120px}
  .cut-top{display:flex;align-items:center;gap:7px}
  .cut-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cut-len{font-size:14px;font-weight:700;line-height:1}
  .cut-qty{font-size:11px;color:var(--g600);padding-left:15px}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--g400);font-weight:700;padding:4px 8px;border-bottom:1px solid var(--g200)}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--g100)}
  .tbl td.n{font-weight:700;color:var(--g600);width:42px}
  .tbl td.len{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .tbl tr.short td{color:var(--red)}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:11px;color:var(--g600);background:var(--g50);padding:3px 9px;border-radius:20px;border:1px solid var(--g200)}
  @media print{.left,.tabs,.cvarea,.hdr-btn{display:none!important}.main{grid-template-columns:1fr}.res{max-height:none}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo">
    <svg class="hdr-logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="10" width="10" height="10" rx="1.5" fill="#14bdeb" opacity=".9"/>
      <rect x="9" y="6" width="10" height="10" rx="1.5" fill="#0e84a4"/>
      <rect x="16" y="10" width="10" height="10" rx="1.5" fill="#0a5e75"/>
      <rect x="9" y="14" width="10" height="10" rx="1.5" fill="#063846"/>
    </svg>
    <span class="hdr-logo-text"><span>LAJES</span>TECH</span>
  </div>
  <div class="hdr-divider"></div>
  <span class="hdr-title">Vãos Irregulares</span>
  <div class="hdr-spacer"></div>
  <button class="hdr-btn" onclick="copiarLista()">Copiar</button>
  <button class="hdr-btn" onclick="window.print()">Imprimir</button>
  <button class="hdr-btn primary" onclick="enviarBubble()">➕ Enviar pro orçamento</button>
</div>
<div class="tabs">
  <button class="tab on" id="btn-rect" onclick="setFmt('rect')">Retângulo</button>
  <button class="tab"    id="btn-trap" onclick="setFmt('trap')">Trapézio</button>
  <button class="tab"    id="btn-tri"  onclick="setFmt('tri')">Triângulo</button>
  <button class="tab"    id="btn-L"    onclick="setFmt('L')">Em L</button>
  <button class="tab"    id="btn-medicoes" onclick="setFmt('medicoes')">📐 Medições</button>
</div>
<div class="main">
  <div class="left" id="leftPanel"></div>
  <div class="right">
    <div class="cvarea" id="cvArea"><canvas id="cv"></canvas></div>
    <div class="res" id="resPanel"><div class="res-empty">Preencha as dimensões para ver o comprimento de cada vigota</div></div>
  </div>
</div>
<script>
// ════════════════════════════════════════════
// CONFIG — injete via URL params ou postMessage
// ════════════════════════════════════════════
const CONFIG = {
  API_BASE   : 'https://app.lajestech.com.br/api/1.1',
  API_TOKEN  : '3685dac860b673b58b65e7822e17f1bd',
  ORC_ID     : '',   // _id do ven_orcamentos
  EMP_ID     : '',   // _id da adm_Empresas
  USER_ID    : '',   // _id do Current User
  GRUPO_LAJE_ID: '', // _id do eng_com_GrupoLaje (base da laje)
  COD_ORC    : '',   // texto "ORC-XXXXXX"
  NUM_LAJE_BASE: 'V',// prefixo para numeração das vigotas (ex: V → V1, V2...)
};

// dados carregados do grupo_laje
let _grupoLaje = null;

// ── Inicializa a partir de URL params ────────
(function initFromUrl(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('orc_id'))         CONFIG.ORC_ID          = p.get('orc_id');
  if(p.get('emp_id'))         CONFIG.EMP_ID          = p.get('emp_id');
  if(p.get('user_id'))        CONFIG.USER_ID         = p.get('user_id');
  if(p.get('grupo_laje_id'))  CONFIG.GRUPO_LAJE_ID   = p.get('grupo_laje_id');
  if(p.get('cod_orc'))        CONFIG.COD_ORC         = p.get('cod_orc');
  if(p.get('num_laje_base'))  CONFIG.NUM_LAJE_BASE   = p.get('num_laje_base');
  // version-test auto-detect
  const href = window.location.href + document.referrer;
  if(href.includes('version-test')) CONFIG.API_BASE = 'https://app.lajestech.com.br/version-test/api/1.1';
  if(CONFIG.GRUPO_LAJE_ID) carregarGrupoLaje(CONFIG.GRUPO_LAJE_ID);
})();

// ── Listener postMessage vindo do Bubble ─────
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  const action = d.action || d.type;
  if(d.source && d.source !== 'bubble_vaos') return;
  if(action === 'set_config'){
    Object.assign(CONFIG, d.config || {});
    if(CONFIG.GRUPO_LAJE_ID) carregarGrupoLaje(CONFIG.GRUPO_LAJE_ID);
  }
});

// ── Carrega eng_com_GrupoLaje e pré-preenche form ──
async function carregarGrupoLaje(id){
  try{
    const r = await fetch(`${CONFIG.API_BASE}/obj/eng_com_GrupoLaje/${id}`,{
      headers:{'Authorization':`Bearer ${CONFIG.API_TOKEN}`}
    });
    if(!r.ok) return;
    const json = await r.json();
    _grupoLaje = json.response;
    // pré-preenche inter-eixo se o campo existir
    const ie = _grupoLaje.inter_eixo_number;
    if(ie && document.getElementById('inIE')){
      document.getElementById('inIE').value = (ie*100).toFixed(0);
      updateS(); recalc();
    }
    // mostra badge do tipo de laje no header
    let badge = document.getElementById('laje-badge');
    if(!badge){
      badge = document.createElement('span');
      badge.id = 'laje-badge';
      badge.style.cssText='font-size:11px;font-weight:600;background:#EBF9FD;color:#0e84a4;padding:3px 9px;border-radius:10px;margin-left:4px';
      document.querySelector('.hdr-title')?.after(badge);
    }
    badge.textContent = _grupoLaje.descricao_laje_text || '';
  }catch(e){ console.warn('Erro ao carregar grupo laje:', e); }
}

// ── Cria registros ven_PlanosLajes via Bubble API ──
async function criarPlanosLajes(grupos, res){
  if(!CONFIG.ORC_ID){ flash('ORC_ID não configurado — verifique URL params'); return false; }
  const apiHeaders = {
    'Authorization': `Bearer ${CONFIG.API_TOKEN}`,
    'Content-Type' : 'application/json',
  };
  const tipo     = _grupoLaje?.descricao_laje_text  || S.tipo.toString() + ' cm';
  const enchim   = _grupoLaje?.enchimento_text       || '';
  const trelica  = _grupoLaje?.tipo_trelica_text     || '';
  const largura  = +(res.n * res.ie).toFixed(2); // estimativa da largura do ambiente
  const apoioCm  = S.incluirApoio ? num(S.apoio) : 0;

  let erros = 0;
  for(let i = 0; i < grupos.length; i++){
    const g = grupos[i];
    const numLaje = `${CONFIG.NUM_LAJE_BASE}${i+1}`;
    const vaoInterno = +(g.comprimento_m - apoioCm/50).toFixed(2); // comprimento - 2 apoios
    const area = +(vaoInterno * largura).toFixed(2);
    const body = {
      'orcamentos_custom_orcamentos': CONFIG.ORC_ID,
      'cod_orcamento_text'           : CONFIG.COD_ORC,
      'dt_prj_numerolaje_text'       : numLaje,
      'dt_prj_tipo_laje_text'        : tipo,
      'dt_prj_tipo_enchimento_text'  : enchim,
      'dt_prj_vigota_number'         : g.comprimento_m,
      'dt_prj_vao_interno_number'    : vaoInterno,
      'dt_prj_vao_largura_number'    : largura,
      'dt_prj_qtdvigota_number'      : g.qtd,
      'dt_prj_area_number'           : +(g.qtd * vaoInterno * res.ie).toFixed(2),
      'tipo_treli_a_text'            : trelica,
      'fase_projeto_option___fase_projeto': 'Fase Unica',
    };
    if(CONFIG.GRUPO_LAJE_ID) body['dt_prj_tipo_laje2_custom_tabelaprecoslaje'] = CONFIG.GRUPO_LAJE_ID;
    if(CONFIG.EMP_ID)        body['empresa_custom_adm_Empresas'] = CONFIG.EMP_ID;
    try{
      const r = await fetch(`${CONFIG.API_BASE}/obj/ven_PlanosLajes`,{
        method:'POST', headers:apiHeaders, body:JSON.stringify(body)
      });
      if(!r.ok){ console.error(`Erro ao criar ${numLaje}:`, await r.text()); erros++; }
    }catch(e){ console.error(e); erros++; }
  }
  return erros === 0;
}

// ════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════
const COLORS=['#E8630A','#2563EB','#1A8C47','#7C3AED','#DB2777',
              '#B45309','#0891B2','#DC2626','#059669','#6D28D9'];
const TIPO_ENCH = { 12:20, 16:30, 20:40, 25:50 }; // largura padrão enchimento por tipo (cm)
const MIN_PRATICO = 0.40; // vigota abaixo disso é avisada como impraticável (m)

// ════════════════════════════════════════════
// STATE  (dimensões guardadas como TEXTO p/ aceitar vírgula)
// ════════════════════════════════════════════
const S = {
  fmt:'rect', ladoReto:'esq', tipo:16,
  baseVig:'12.5', enchFill:'30', compEnch:'100', apoio:'7', maxVig:'7.00',
  tipoEnch:'eps', ceil:true, incluirApoio:true,
  bMaior:'', bMenor:'', prof:'',
  lA:'', cA:'', lB:'', cB:'',
  medicoes:''
};

// Aceita "6,5" / "6.5" / "1.234,56"
function num(v){
  if(typeof v==='number') return v;
  if(v==null) return 0;
  let s=String(v).trim().replace(/\s/g,'');
  if(s==='') return 0;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
function interEixo(){ return (num(S.baseVig)+num(S.enchFill))/100; } // m
function rnd(x){ const s=0.05; return (S.ceil?Math.ceil(x/s):Math.round(x/s))*s; }

// ════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════
function setFmt(f){
  S.fmt=f;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('btn-'+f).classList.add('on');
  buildLeft(); go();
}
function setTipo(t){
  S.tipo=t; S.enchFill=String(TIPO_ENCH[t]);
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById('t'+t).classList.add('on');
  buildLeft(); go();
}
function setTipoEnch(tp){
  S.tipoEnch=tp; S.compEnch=tp==='eps'?'100':'20';
  buildLeft(); go();
}
function setSide(s){ S.ladoReto=s; buildLeft(); go(); }
function toggle(key){ S[key]=!S[key]; buildLeft(); go(); }
function syncIE(){ // atualiza só o display do inter-eixo, sem rebuild (preserva foco)
  const ie=num(S.baseVig)+num(S.enchFill);
  const el=document.getElementById('ieVal'); if(el) el.textContent=ie.toFixed(1)+' cm';
  const el2=document.getElementById('ieM'); if(el2) el2.textContent=(ie/100).toFixed(4)+' m';
  buildDiagram();
}

// ════════════════════════════════════════════
// BUILD LEFT PANEL
// ════════════════════════════════════════════
function sideCard(id,label,pts,sel){
  const col=sel?'#E8630A':'#9CA3AF', fill=sel?'#FFF4EE':'#F9FAFB';
  return `<div class="sc ${sel?'on':''}" onclick="setSide('${id}')">
    <svg width="44" height="30" viewBox="0 0 44 30">
      <polygon points="${pts}" fill="${fill}" stroke="${col}" stroke-width="1.5"/>
      ${id==='esq'?`<line x1="2" y1="2" x2="2" y2="28" stroke="${col}" stroke-width="2.2"/>`:''}
      ${id==='dir'?`<line x1="42" y1="2" x2="42" y2="28" stroke="${col}" stroke-width="2.2"/>`:''}
    </svg><span>${label}</span></div>`;
}
function fi(id,ph,key,unit,hint){
  return `<div class="fg"><div class="fl">${ph.label}</div>
    <div class="fr"><input class="fi" type="text" inputmode="decimal" id="${id}" placeholder="${ph.ph}" value="${S[key]??''}" oninput="S.${key}=this.value;go()"><span class="fu">${unit||'m'}</span></div>
    ${hint?`<div class="hint">${hint}</div>`:''}
    ${key==='bMenor'?'<div class="err" id="errBm"></div>':''}</div>`;
}
function buildDiagram(){
  const el=document.getElementById('modDiag'); if(!el) return;
  const bv=num(S.baseVig), ef=num(S.enchFill), ie=bv+ef;

}

// ════════════════════════════════════════════
// CALCULATION  →  retorna lista de vigotas com comprimento
// ════════════════════════════════════════════
function clearError(){ const e=document.getElementById('errBm'); if(e)e.classList.remove('on'); }
function setError(msg){ const e=document.getElementById('errBm'); if(e){e.textContent=msg;e.classList.add('on');} }

// Cada shape devolve { vaos:[{vao, label}], areaReal } onde vao = vão livre (m)
function spansFor(){
  const ie=interEixo(); if(ie<=0) return null;
  const f=S.fmt;
  if(f==='rect'){
    const C=num(S.bMaior), L=num(S.prof);
    if(!C||!L) return null;
    const n=Math.ceil(L/ie);
    const vaos=Array.from({length:n},(_,i)=>({vao:C,label:'V'+(i+1)}));
    return {vaos, areaReal:C*L};
  }
  if(f==='trap'){
    const bM=num(S.bMaior), bm=num(S.bMenor), pf=num(S.prof);
    if(!bM||!pf||!bm) return null;
    if(bm>=bM){ setError('Base menor deve ser menor que a base maior'); return {error:true}; }
    clearError();
    const n=Math.ceil(pf/ie);
    const vaos=Array.from({length:n},(_,i)=>{
      const frac=Math.min(((i+0.5)*ie)/pf,1);     // posição relativa da vigota
      return {vao:bm+frac*(bM-bm), label:'V'+(i+1)};
    });
    return {vaos, areaReal:(bM+bm)/2*pf};
  }
  if(f==='tri'){
    const bM=num(S.bMaior), pf=num(S.prof);
    if(!bM||!pf) return null;
    const n=Math.ceil(pf/ie);
    const vaos=Array.from({length:n},(_,i)=>{
      const frac=Math.min(((i+0.5)*ie)/pf,1);
      return {vao:frac*bM, label:'V'+(i+1)};
    });
    return {vaos, areaReal:bM*pf/2};
  }
  if(f==='L'){
    const lA=num(S.lA),cA=num(S.cA),lB=num(S.lB),cB=num(S.cB);
    if(!lA||!cA||!lB||!cB) return null;
    const nA=Math.ceil(lA/ie), nB=Math.ceil(lB/ie);
    const vaos=[
      ...Array.from({length:nA},(_,i)=>({vao:cA,label:'A'+(i+1)})),
      ...Array.from({length:nB},(_,i)=>({vao:cB,label:'B'+(i+1)}))
    ];
    return {vaos, areaReal:lA*cA+lB*cB};
  }
  if(f==='medicoes'){
    const arr=String(S.medicoes||'').split(/[\n;]+/).map(num).filter(v=>v>0);
    if(!arr.length) return null;
    const vaos=arr.map((v,i)=>({vao:v,label:'V'+(i+1)}));
    // área aproximada: soma(vão × inter-eixo)
    return {vaos, areaReal:arr.reduce((s,v)=>s+v*ie,0)};
  }
  return null;
}

function doCalc(){
  const base=spansFor();
  if(!base) return null;
  if(base.error) return {error:true};
  const ie=interEixo();
  const ap=num(S.apoio)/100;
  const add=S.incluirApoio?2*ap:0;
  const compEnchM=num(S.compEnch)/100||1;
  const maxVig=num(S.maxVig)||999;

  const vigotas=base.vaos.map(v=>{
    const comp=rnd(v.vao+add);
    const ench=Math.max(0,Math.ceil(v.vao/compEnchM)); // enchimento usa o VÃO LIVRE, não o corte
    return {label:v.label, vao:v.vao, comp, ench};
  });

  // agrupa por comprimento
  const grupos={};
  vigotas.forEach(v=>{const k=v.comp.toFixed(2); grupos[k]=(grupos[k]||0)+1;});

  const comps=vigotas.map(v=>v.comp);
  const totalLinear=comps.reduce((s,c)=>s+c,0);
  const totalEnch=vigotas.reduce((s,v)=>s+v.ench,0);
  const minC=Math.min(...comps), maxC=Math.max(...comps);

  // avisos
  const curtas=vigotas.filter(v=>v.comp>0 && v.comp<MIN_PRATICO);
  const longas=vigotas.filter(v=>v.comp>maxVig);

  return {vigotas, grupos, n:vigotas.length, totalLinear, totalEnch, minC, maxC, ie,
          curtas, longas, areaReal:base.areaReal};
}

// ════════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════════
function doDraw(res){
  const area=document.getElementById('cvArea'), cv=document.getElementById('cv');
  const W=Math.max(area.clientWidth-28,200), H=Math.max(area.clientHeight-18,150);
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,H);
  if(!res||res.error||!res.vigotas||!res.vigotas.length) return;
  const f=S.fmt, ie=res.ie, lr=S.ladoReto, n=res.vigotas.length;
  const enchCol=S.tipoEnch==='eps'?'#BFDBFE':'#FED7AA';
  const keys=Object.keys(res.grupos).sort((a,b)=>parseFloat(a)-parseFloat(b));
  const colorFor=c=>COLORS[keys.indexOf(c.toFixed(2))%COLORS.length];
  const padL=54, padR=22, padT=26, padB=30;
  const innerW=W-padL-padR, innerH=H-padT-padB;

  // ── EM L ──
  if(f==='L'){
    const cA=num(S.cA), cB=num(S.cB);
    const nA=res.vigotas.filter(v=>v.label[0]==='A').length, nB=n-nA;
    const depthA=nA*ie, totD=(nA+nB)*ie, maxC=Math.max(cA,cB);
    const sc=Math.min(innerW/Math.max(maxC,0.1), innerH/Math.max(totD,0.1));
    const x0=padL+(innerW-maxC*sc)/2, y0=padT+(innerH-totD*sc)/2;
    res.vigotas.forEach((v,i)=>stripe(ctx,x0,y0+i*ie*sc,v.vao*sc,ie*sc,colorFor(v.comp),enchCol,v.comp,v.label,sc));
    ctx.beginPath();
    ctx.moveTo(x0,y0);ctx.lineTo(x0+cA*sc,y0);ctx.lineTo(x0+cA*sc,y0+depthA*sc);
    ctx.lineTo(x0+cB*sc,y0+depthA*sc);ctx.lineTo(x0+cB*sc,y0+totD*sc);ctx.lineTo(x0,y0+totD*sc);
    ctx.closePath();ctx.strokeStyle='#1F2937';ctx.lineWidth=2.4;ctx.stroke();
    dimLabel(ctx,x0+cA*sc/2,y0-9,'A '+cA.toFixed(2)+' m');
    dimLabel(ctx,x0+cB*sc/2,y0+totD*sc+18,'B '+cB.toFixed(2)+' m');
    return;
  }

  // ── RETÂNGULO / TRAPÉZIO / TRIÂNGULO / MEDIÇÕES ──
  const spans=res.vigotas.map(v=>v.vao);
  const bm=num(S.bMenor), bM=num(S.bMaior), pf=num(S.prof);
  // largura máxima e profundidade REAIS do vão
  let maxSpan, drawDepth;
  if(f==='trap'||f==='tri'){ maxSpan=Math.max(bM, ...spans); drawDepth=pf; }
  else if(f==='rect'){ maxSpan=Math.max(...spans); drawDepth=pf; }
  else { maxSpan=Math.max(...spans); drawDepth=n*ie; } // medições (sem profundidade definida)
  const band=drawDepth/n;
  const sc=Math.min(innerW/Math.max(maxSpan,0.1), innerH/Math.max(drawDepth,0.1));
  const x0=padL+(innerW-maxSpan*sc)/2, y0=padT+(innerH-drawDepth*sc)/2;
  const xoff=span=>{
    if(f==='trap'){ if(lr==='dir') return maxSpan-span; if(lr==='sim') return (maxSpan-span)/2; return 0; }
    if(f==='tri') return (maxSpan-span)/2;
    return 0; // rect, medições → parede esquerda reta
  };
  // profundidade (centro) de cada vigota: posicionada onde a parede tem a largura do seu vão,
  // assim a ponta encosta exatamente na diagonal e o desenho fica proporcional às cotas reais
  const yCenter=(v,i)=>{
    if(f==='trap' && bM>bm) return ((v.vao-bm)/(bM-bm))*drawDepth;
    if(f==='tri'  && bM>0 ) return (v.vao/bM)*drawDepth;
    return (i+0.5)*band; // rect, medições
  };
  res.vigotas.forEach((v,i)=>{
    const yi=Math.min(Math.max(0,yCenter(v,i)-band/2), Math.max(0,drawDepth-band));
    stripe(ctx,x0+xoff(v.vao)*sc, y0+yi*sc, v.vao*sc, band*sc, colorFor(v.comp), enchCol, v.comp, v.label, sc);
  });

  // contorno verdadeiro do vão (paredes diagonais incluídas), pelas cotas reais
  const P=(x,y)=>[x0+x*sc,y0+y*sc];
  let pts;
  if(f==='rect'){ pts=[P(0,0),P(maxSpan,0),P(maxSpan,drawDepth),P(0,drawDepth)]; }
  else if(f==='trap'){
    if(lr==='dir')      pts=[P(maxSpan-bm,0),P(maxSpan,0),P(maxSpan,drawDepth),P(0,drawDepth)];
    else if(lr==='sim') pts=[P((maxSpan-bm)/2,0),P((maxSpan+bm)/2,0),P(maxSpan,drawDepth),P(0,drawDepth)];
    else                pts=[P(0,0),P(bm,0),P(bM,drawDepth),P(0,drawDepth)];
  }
  else if(f==='tri'){ pts=[P(maxSpan/2,0),P(maxSpan,drawDepth),P(0,drawDepth)]; }
  else { // medições: parede esquerda reta + degraus à direita seguindo cada medida
    pts=[P(0,0)];
    res.vigotas.forEach((v,i)=>{ pts.push(P(v.vao,i*band)); pts.push(P(v.vao,(i+1)*band)); });
    pts.push(P(0,drawDepth));
  }
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();
  ctx.strokeStyle='#1F2937';ctx.lineWidth=2.4;ctx.stroke();

  // cotas (valores reais das paredes)
  const cx=x0+maxSpan*sc/2;
  ctx.save();ctx.translate(x0-20,y0+drawDepth*sc/2);ctx.rotate(-Math.PI/2);
  dimLabel(ctx,0,0, pf?pf.toFixed(2)+' m':''); ctx.restore();
  if(f==='rect') dimLabel(ctx,cx,y0-9, num(S.bMaior).toFixed(2)+' m');
  if(f==='trap'){
    const topCx = lr==='dir' ? x0+(maxSpan-bm/2)*sc : lr==='sim' ? cx : x0+(bm/2)*sc;
    dimLabel(ctx,topCx,y0-9, 'menor '+bm.toFixed(2)+' m');
    dimLabel(ctx,x0+(bM/2)*sc,y0+drawDepth*sc+18, 'maior '+bM.toFixed(2)+' m');
  }
  if(f==='tri') dimLabel(ctx,cx,y0+drawDepth*sc+18, bM.toFixed(2)+' m');
}
function dimLabel(ctx,x,y,txt){
  if(!txt) return;
  ctx.fillStyle='#6B7280'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(txt,x,y);
}
function stripe(ctx,x,y,w,h,col,enchCol,comp,label,sc){
  const bvpx=Math.max(2,Math.min(h-1,(num(S.baseVig)/100)*sc));
  const efpx=Math.max(1,h-bvpx-1);
  ctx.fillStyle=col+'70'; ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.fillRect(x,y,w,bvpx); ctx.strokeRect(x,y,w,bvpx);
  ctx.fillStyle=enchCol+'AA'; ctx.fillRect(x,y+bvpx,w,efpx);
  ctx.strokeStyle=col+'40'; ctx.lineWidth=0.5; ctx.strokeRect(x,y+bvpx,w,efpx);
  if(h>12 && w>40){
    ctx.fillStyle=col; ctx.font=`bold ${Math.min(10,h*0.45)}px sans-serif`; ctx.textAlign='left';
    ctx.fillText(label,x+3,y+h/2+3.5);
    ctx.textAlign='right';
    ctx.fillText(comp.toFixed(2)+'m',x+w-3,y+h/2+3.5);
  }
}

function doResult(res){
  const el=document.getElementById('resPanel');
  if(!res){ el.innerHTML='<div class="res-empty">Preencha as dimensões para ver o comprimento de cada vigota</div>'; return; }
  if(res.error){ el.innerHTML='<div class="res-empty" style="color:var(--red)">Confira os dados destacados ao lado.</div>'; return; }

  const enchLabel=S.tipoEnch==='eps'?'EPS':'lajotas';
  const keys=Object.keys(res.grupos).sort((a,b)=>parseFloat(b)-parseFloat(a));
  const colorFor=c=>COLORS[Object.keys(res.grupos).sort((a,b)=>parseFloat(a)-parseFloat(b)).indexOf(c)%COLORS.length];

  let warns='';
  if(res.longas.length) warns+=`<div class="warn red">⚠️ ${res.longas.length} vigota(s) acima de ${num(S.maxVig).toFixed(2)} m — precisam de emenda/encomenda especial (${res.longas.map(v=>v.label).join(', ')}).</div>`;
  if(res.curtas.length) warns+=`<div class="warn amber">⚠️ ${res.curtas.length} vigota(s) abaixo de ${MIN_PRATICO.toFixed(2)} m — verifique se compensa moldar no local (${res.curtas.map(v=>v.label).join(', ')}).</div>`;

  const chips=keys.map(k=>{
    const col=colorFor(k);
    return `<div class="cut" style="border-color:${col}50;background:${col}08">
      <div class="cut-top"><div class="cut-dot" style="background:${col}"></div>
      <div class="cut-len" style="color:${col}">${parseFloat(k).toFixed(2)} m</div></div>
      <div class="cut-qty">${res.grupos[k]} vigota${res.grupos[k]>1?'s':''}</div></div>`;
  }).join('');

  const rows=res.vigotas.map(v=>{
    const short=v.comp<MIN_PRATICO||v.comp>num(S.maxVig);
    return `<tr class="${short?'short':''}"><td class="n">${v.label}</td><td>${v.vao.toFixed(2)} m</td><td class="len">${v.comp.toFixed(2)} m</td><td style="text-align:right;color:var(--g600)">${v.ench}</td></tr>`;
  }).join('');

  el.innerHTML=`
    <div class="res-kpis">
      <div><div class="kpi-v">${res.n}</div><div class="kpi-l">vigotas</div></div>
      <div><div class="kpi-v g">${res.totalLinear.toFixed(2)}</div><div class="kpi-l">metros lineares</div></div>
      <div><div class="kpi-v bl">${res.minC.toFixed(2)}–${res.maxC.toFixed(2)}</div><div class="kpi-l">faixa de comp. (m)</div></div>
      <div><div class="kpi-v su">${res.totalEnch}</div><div class="kpi-l">${enchLabel} (estim.)</div></div>
      <div style="align-self:center"><div class="badges">
        <span class="pill">e/e ${(res.ie*100).toFixed(1)} cm</span>
        <span class="pill">apoio ${S.incluirApoio?num(S.apoio).toFixed(0)+' cm/lado':'não incluído'}</span>
      </div></div>
    </div>
    ${warns}
    <div class="res-grid">
      <div><div class="blk-title">Resumo por comprimento</div><div class="cuts">${chips}</div></div>
      <div><div class="blk-title">Lista de vigotas (na ordem)</div>
        <table class="tbl"><thead><tr><th>#</th><th>Vão</th><th style="text-align:right">Comprimento</th><th style="text-align:right">Ench.</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

// ════════════════════════════════════════════
// EXPORT
// ════════════════════════════════════════════
function buildPayload(){
  const res=doCalc(); if(!res||res.error) return null;
  return {
    formato:S.fmt,
    inter_eixo_cm:+(res.ie*100).toFixed(1),
    apoio_cm:S.incluirApoio?num(S.apoio):0,
    tipo_vigota_cm:S.tipo,
    tipo_enchimento:S.tipoEnch,
    total_vigotas:res.n,
    total_metros_lineares:+res.totalLinear.toFixed(2),
    enchimento_total:res.totalEnch,
    comprimento_min:+res.minC.toFixed(2),
    comprimento_max:+res.maxC.toFixed(2),
    grupos:Object.keys(res.grupos).sort((a,b)=>parseFloat(b)-parseFloat(a)).map(k=>({comprimento_m:parseFloat(k),qtd:res.grupos[k]})),
    vigotas:res.vigotas.map(v=>({n:v.label,vao_m:+v.vao.toFixed(2),comprimento_m:+v.comp.toFixed(2),enchimento:v.ench}))
  };
}
async function enviarBubble(){
  const p = buildPayload();
  if(!p){ flash('Preencha as dimensões primeiro'); return; }

  // sempre notifica o Bubble pai (iframe mode)
  try{ window.parent.postMessage({source:'lajestech_vaos', payload:p}, '*'); }catch(e){}

  // se não tiver ORC_ID não cria registros no banco
  if(!CONFIG.ORC_ID){
    flash('Resultado enviado pro orçamento ✓');
    return;
  }

  // mostra progresso
  const btn = document.querySelector('.hdr-btn.primary');
  const origTxt = btn?.textContent;
  if(btn){ btn.textContent = '⏳ Salvando…'; btn.disabled = true; }

  try{
    const res = doCalc(); // reutiliza cálculo atual
    const ok = await criarPlanosLajes(p.grupos, res);
    if(ok){
      flash(`✅ ${p.grupos.length} registro(s) criado(s) em ven_PlanosLajes`);
    } else {
      flash('⚠️ Alguns registros não foram salvos — veja o console');
    }
  }catch(err){
    console.error(err);
    flash('Erro ao salvar no banco: ' + err.message);
  }finally{
    if(btn){ btn.textContent = origTxt; btn.disabled = false; }
  }
}
function copiarLista(){
  const p=buildPayload();
  if(!p){ flash('Preencha as dimensões primeiro'); return; }
  let txt=`LISTA DE VIGOTAS — ${p.formato.toUpperCase()}\n`;
  txt+=`Inter-eixo: ${p.inter_eixo_cm} cm | Apoio: ${p.apoio_cm} cm/lado\n`;
  txt+=`Total: ${p.total_vigotas} vigotas · ${p.total_metros_lineares} m lineares\n\n`;
  txt+=`RESUMO POR COMPRIMENTO\n`+p.grupos.map(g=>`  ${g.qtd}× ${g.comprimento_m.toFixed(2)} m`).join('\n');
  txt+=`\n\nNA ORDEM\n`+p.vigotas.map(v=>`  ${v.n}: ${v.comprimento_m.toFixed(2)} m`).join('\n');
  navigator.clipboard?.writeText(txt).then(()=>flash('Lista copiada ✓'),()=>flash('Não foi possível copiar'));
}
function flash(msg){
  let t=document.getElementById('flash');
  if(!t){t=document.createElement('div');t.id='flash';
    t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .2s';
    document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.opacity='0',1800);
}

// ════════════════════════════════════════════
// MAIN
// ════════════════════════════════════════════
function go(){
  const res=doCalc();
  doDraw(res); doResult(res); syncIE();
}
buildLeft(); go();
window.addEventListener('resize',go);

// expõe p/ teste headless (Node)
if(typeof module!=='undefined'){ module.exports={num,doCalc,S,interEixo}; }
</script>
