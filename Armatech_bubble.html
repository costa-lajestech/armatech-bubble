<!-- ══════════════════════════════════════════════════════════════
     BLOCO DE CONFIGURAÇÃO — TODAS AS VARIÁVEIS DO BUBBLE AQUI
     O Bubble substitui os valores abaixo com dados dinâmicos.
     Exemplo (Bubble HTML element): CONFIG.ORC_ID = '[Current Page Orcamento s _id]'
════════════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  /* ── Bubble API ──────────────────────────────────────────── */
  API_BASE  : 'https://app.lajestech.com.br/api/1.1',
  API_TOKEN : '3685dac860b673b58b65e7822e17f1bd',  // ← Bubble: App token

  /* ── Contexto do pedido (Bubble injeta) ─────────────────── */
  ORC_ID    : '',   // ← Bubble: Current Page Orcamento's _id
  EMP_ID    : '',   // ← Bubble: Current Page Empresa's _id
  USER_ID   : '',   // ← Bubble: Current User's _id

  /* ── Dados do projeto (Bubble injeta) ───────────────────── */
  PROJ_NOME    : 'Projeto',
  PROJ_CLIENTE : '',
  PROJ_PAV     : '',
  PROJ_REV     : 'R01',
  PROJ_RESP    : '',
  PROJ_NORMA   : 'NBR 6118',

  /* ── Preço padrão por kg ────────────────────────────────── */
  PRECO_KG : 8.50,  // ← Bubble: Empresa's preco_kg_aco

  /* ── Endpoints dos workflows Bubble (POST) ──────────────── */
  // ⚠️ Ajuste os nomes abaixo para os nomes reais dos seus API Workflows no Bubble
  WF_INSERIR : '/wf/ven_inserir_ferragem',
  WF_EDITAR  : '/wf/ven_editar_ferragem',
  WF_EXCLUIR : '/wf/ven_excluir_ferragem',

  /* ── Data types para leitura (GET) ─────────────────────── */
  OBJ_FERRAGEM  : '/obj/ven_elementos_fa',       // ← atualizado para ven_elementos_FA
  OBJ_GRUPO_FA  : '/obj/eng_grupo_ferragens',

  /* ── Modo: 'popup_only' | 'auto_open' ──────────────────── */
  MODO : 'popup_only',
};

/* ════════════════════════════════════════════════════════════
   CONSTANTES DE ENGENHARIA (fixas — não alterar)
════════════════════════════════════════════════════════════ */
const KGM = {3.8:0.089,4.2:0.109,5:0.154,6:0.222,6.3:0.245,7:0.302,8:0.395,9.5:0.558,10:0.617,12.5:0.963,16:1.578,20:2.466,25:3.853};
let BITS = Object.keys(KGM).map(Number); // filtrado por empresa via set_config
const TRELICAS = {'TR 8645':0.735,'TR 12645':0.880,'TR 16745':1.060,'TR 20745':1.222,'TR 25856':1.556};
const TELAS_PADRAO = {'Q-61 (Ø3,4 c/15)':0.97,'Q-92 (Ø4,2 c/15)':1.48,'Q-113 (Ø4,2 c/10)':1.80,'Q-138 (Ø4,2 c/10)':2.20,'Q-196 (Ø5 c/10)':3.11};
const REVENDA_CAT = [
  {prod:'Barra CA-50 12 m',un:'barra',preco:78,pesoFn:it=>12*KGM[it.bit||10]*it.q,temBit:true},
  {prod:'Arame recozido nº 18',un:'kg',preco:14.5,pesoFn:it=>it.q},
  {prod:'Prego 17×27',un:'kg',preco:13.9,pesoFn:it=>it.q},
  {prod:'Espaçador plástico 25 mm',un:'un',preco:0.18,pesoFn:it=>0},
];
const CATALOGO = [
  {g:'Estruturais sob medida',itens:[
    {tipo:'Viga',eng:'viga',desc:'Armação completa: longitudinais + estribos'},
    {tipo:'Baldrame',eng:'viga',desc:'Viga de fundação'},
    {tipo:'Cinta de amarração',eng:'viga',desc:'Cinta sobre alvenaria'},
    {tipo:'Verga / Contraverga',eng:'viga',desc:'Portas e janelas'},
    {tipo:'Pilar',eng:'pilar',desc:'Armação de pilar sob projeto'},
    {tipo:'Sapata',eng:'sapata',desc:'Malha X/Y sob medida'},
    {tipo:'Bloco de coroamento',eng:'sapata',desc:'Sobre estacas'},
    {tipo:'Escada',eng:'viga',desc:'Lance armado'},
  ]},
  {g:'Fundação profunda',itens:[
    {tipo:'Estaca',eng:'circ',desc:'Armadura circular + espiral'},
    {tipo:'Tubulão',eng:'circ',desc:'Circular de grande diâmetro'},
  ]},
  {g:'Peças prontas / avulsas',itens:[
    {tipo:'Coluna pronta',eng:'pilar',desc:'Padrão de prateleira'},
    {tipo:'Estribo pronto',eng:'estribo',desc:'Vendido por cento/milheiro'},
    {tipo:'Corte e dobra',eng:'reta',desc:'Peça avulsa sob desenho'},
  ]},
  {g:'Telas e treliças',itens:[
    {tipo:'Tela soldada',eng:'tela',desc:'Painéis Q-61 a Q-196'},
    {tipo:'Malha para laje',eng:'tela',desc:'Sob medida da laje'},
    {tipo:'Treliça',eng:'trelica',desc:'TR 8 a TR 25 (kg/m)'},
  ]},
  {g:'Revenda (sem produção)',itens:[
    {tipo:'Item de revenda',eng:'revenda',desc:'Barra 12 m, arame, prego, espaçador'},
  ]},
];
const PREF = {
  'Viga':'V','Baldrame':'BLD','Pilar':'P','Sapata':'S','Estaca':'EK','Tubulão':'TB',
  'Coluna pronta':'CP','Estribo pronto':'EP','Corte e dobra':'CD','Tela soldada':'TS',
  'Malha para laje':'ML','Treliça':'TR','Cinta de amarração':'CA','Verga / Contraverga':'VG',
  'Bloco de coroamento':'BC','Escada':'ES','Item de revenda':'RV'
};

/* ── Headers HTTP derivados do CONFIG ───────────────────────── */
const API_HEADERS = {
  'Authorization': `Bearer ${CONFIG.API_TOKEN}`,
  'Content-Type' : 'application/json',
};
</script>

.btn{background:var(--pr);color:#04293d;border:0;border-radius:8px;padding:9px 18px;font-family:'Poppins';font-weight:600;font-size:13px;cursor:pointer;transition:background .15s}

.popup-grupo select{width:100%;max-width:500px;padding:8px 12px;border:1.5px solid #bae6fd;border-radius:8px;font-family:'Lato';font-size:13px;color:var(--navy);background:#fff}
.popup-grupo select:focus{outline:0;border-color:var(--pr)}
.grupo-tag{display:inline-block;background:#0ea5e9;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:8px;vertical-align:middle}
.popup-two{display:grid;grid-template-columns:1fr 1fr;min-height:300px}
.popup-form-wrap{padding:16px 20px;border-right:1px solid var(--bd);overflow-y:auto;max-height:55vh}

.popup-svg-wrap{text-align:center;background:#fff;border-radius:10px;border:1px solid var(--bd);padding:10px}
#popup-pecas table{font-size:12px;width:100%;border-collapse:collapse;background:#fff}

.popup-ft .field{margin:0}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-family:'Poppins';font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.ok{background:var(--grn)}

/* Loading spinner */
.btn-loading{position:relative;pointer-events:none}

@media(max-width:900px){.popup-two{grid-template-columns:1fr}.popup-form-wrap{border-right:none;border-bottom:1px solid var(--bd)}}
</style>

<script>
/* ══════════════════════════════════════════════════════
   ESTADO LOCAL (temporário — dados vivem no Bubble)
══════════════════════════════════════════════════════ */
let _elTemp    = null;   // ferragem sendo editada no popup
let _editingId = null;   // código local (ex: "V1")
let _bubbleId  = null;   // _id do registro Bubble (para edição)
let _codsUsados = [];    // códigos já inseridos neste orçamento
let _grupoId   = null;   // _id do Eng_Grupo_Ferragens selecionado
let _grupos    = [];     // grupos disponíveis para o tipo atual

/* ══════════════════════════════════════════════════════
   UTILITÁRIOS DE ENGENHARIA
══════════════════════════════════════════════════════ */
const engDe = t => { for(const g of CATALOGO) for(const i of g.itens) if(i.tipo===t) return i.eng; return 'viga'; };
const R$    = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fkg   = v => v.toLocaleString('pt-BR',{maximumFractionDigits:1})+' kg';

function pecas(el){
  const eng=engDe(el.tipo),out=[],qc=el.qcom||1;
  if(eng==='viga'||eng==='pilar'){
    let nb=0;
    el.longs.forEach(lg=>{nb++;
      const comp=Math.max(0,el.L-2*el.cob+2*lg.anc);
      out.push({cod:'B'+nb,tipo:'Barra',pos:lg.pos,bit:lg.bit,comp,q:lg.q*qc,
        dobra:lg.anc>0?`2 dobras 90° (${lg.anc} cm)`:'reta',
        peso:comp/100*KGM[lg.bit]*lg.q*qc})});
    if(el.est){
      const w=el.b-2*el.cob,hh=el.h-2*el.cob,gan=Math.max(5,10*el.est.bit/10);
      const comp=2*(w+hh)+2*gan,q=(el.est.esp>0?Math.floor((el.L-2*el.cob)/el.est.esp)+1:0)*qc;
      out.push({cod:'E1',tipo:'Estribo',pos:`${w.toFixed(0)}×${hh.toFixed(0)} c/${el.est.esp}`,bit:el.est.bit,comp,q,
        dobra:'4×90° + ganchos 135°',peso:comp/100*KGM[el.est.bit]*q})}
  } else if(eng==='sapata'){
    let nb=0;
    el.longs.forEach(lg=>{nb++;
      const comp=Math.max(0,(lg.pos.includes('X')?el.b:el.h)-2*el.cob+2*lg.anc);
      out.push({cod:'B'+nb,tipo:'Barra',pos:lg.pos,bit:lg.bit,comp,q:lg.q*qc,
        dobra:`2 dobras 90° (${lg.anc} cm)`,peso:comp/100*KGM[lg.bit]*lg.q*qc})})
  } else if(eng==='circ'){
    el.longs.forEach((lg,i)=>{
      const comp=el.L+lg.anc;
      out.push({cod:'B'+(i+1),tipo:'Barra',pos:'Longitudinal (círculo)',bit:lg.bit,comp,q:lg.q*qc,
        dobra:`arranque ${lg.anc} cm`,peso:comp/100*KGM[lg.bit]*lg.q*qc})});
    const dEsp=el.D-2*el.cob,voltas=Math.ceil(el.L/el.espiral.passo)+1;
    const compEsp=voltas*Math.PI*dEsp+30;
    out.push({cod:'H1',tipo:'Espiral',pos:`Ø${dEsp.toFixed(0)} cm · passo ${el.espiral.passo}`,bit:el.espiral.bit,comp:compEsp,q:qc,
      dobra:`${voltas} voltas helicoidais (rolo)`,peso:compEsp/100*KGM[el.espiral.bit]*qc})
  } else if(eng==='estribo'){
    const gan=Math.max(5,10*el.estb.bit/10),comp=2*(el.b+el.h)+2*gan;
    out.push({cod:'E1',tipo:'Estribo',pos:`${el.b}×${el.h} cm`,bit:el.estb.bit,comp,q:qc,
      dobra:'4×90° + ganchos 135°',peso:comp/100*KGM[el.estb.bit]*qc})
  } else if(eng==='reta'){
    const comp=el.comp+el.dobras*el.anc;
    out.push({cod:'B1',tipo:'Barra',pos:'Sob desenho',bit:el.bitr,comp,q:qc,
      dobra:el.dobras?`${el.dobras} dobra(s) de ${el.anc} cm`:'reta',peso:comp/100*KGM[el.bitr]*qc})
  } else if(eng==='tela'){
    const kgm2=TELAS_PADRAO[el.modeloTela],area=el.W/100*el.H/100;
    out.push({cod:'T1',tipo:'Painel de tela',pos:el.modeloTela,bit:'-',comp:el.H,q:qc,
      dobra:`painel ${(el.W/100).toFixed(2)}×${(el.H/100).toFixed(2)} m · ${(area*kgm2).toFixed(1)} kg/painel`,peso:area*kgm2*qc})
  } else if(eng==='trelica'){
    out.push({cod:'TR1',tipo:'Treliça',pos:el.modeloTr,bit:'-',comp:el.L,q:qc,
      dobra:`${TRELICAS[el.modeloTr]} kg/m`,peso:el.L/100*TRELICAS[el.modeloTr]*qc})
  } else if(eng==='revenda'){
    el.rev.forEach((it,i)=>{const cat=REVENDA_CAT.find(c=>c.prod===it.prod);
      out.push({cod:'R'+(i+1),tipo:'Revenda',pos:it.prod+(cat.temBit?` Ø${it.bit}`:''),bit:it.bit||'-',comp:0,q:it.q,
        dobra:cat.un,peso:cat.pesoFn(it),precoUn:cat.preco})})
  }
  return out;
}
const pesoEl = el => pecas(el).reduce((s,p)=>s+p.peso,0);

function resumoEl(e){
  const eng=engDe(e.tipo);
  if(eng==='circ')    return `Ø${e.D}×${e.L} cm`;
  if(eng==='estribo') return `${e.b}×${e.h} cm · ${e.qcom} un`;
  if(eng==='reta')    return `Ø${e.bitr} · ${e.comp} cm · ${e.qcom} un`;
  if(eng==='tela')    return `${e.modeloTela} · ${e.qcom} painéis`;
  if(eng==='trelica') return `${e.modeloTr} · ${(e.L/100).toFixed(1)} m · ${e.qcom} un`;
  if(eng==='revenda') return `${e.rev.length} item(s)`;
  return `${e.b}×${e.h}×${e.L} cm${(e.qcom||1)>1?' · '+e.qcom+' un':''}`;
}

function validaEl(el){
  const erros=[],eng=engDe(el.tipo);
  if(eng==='viga'||eng==='pilar'){
    if(!el.L||el.L<=0) erros.push('Comprimento deve ser maior que zero');
    if(!el.b||el.b<=0) erros.push('Largura b deve ser maior que zero');
    if(!el.h||el.h<=0) erros.push('Altura h deve ser maior que zero');
    if(el.cob>=el.b/2) erros.push(`Cobrimento ${el.cob}cm ≥ b/2 — seção inválida`);
    if(el.cob>=el.h/2) erros.push(`Cobrimento ${el.cob}cm ≥ h/2 — seção inválida`);
    if(el.est&&el.est.esp<=0) erros.push('Espaçamento de estribos deve ser maior que zero');
  } else if(eng==='sapata'){
    if(el.cob>=Math.min(el.b,el.h)/2) erros.push('Cobrimento excessivo');
  } else if(eng==='circ'){
    if(el.D<=0) erros.push('Diâmetro deve ser maior que zero');
    if(el.cob>=el.D/2) erros.push('Cobrimento maior que o raio');
    if(el.espiral&&el.espiral.passo<=0) erros.push('Passo da espiral deve ser maior que zero');
  }
  return erros;
}

/* ══════════════════════════════════════════════════════
   COMUNICAÇÃO COM O BUBBLE
══════════════════════════════════════════════════════ */

/** Notifica o Bubble pai (iframe postMessage) */
function notifyBubble(event, data){
  window.parent.postMessage({ source:'armatech', event, data }, '*');
}

/** POST para workflow do Bubble */
async function bubblePost(endpoint, body){
  const res = await fetch(CONFIG.API_BASE + endpoint, {
    method:'POST', headers:API_HEADERS, body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error(`Bubble ${res.status}: ${await res.text()}`);
  return res.json();
}

/** GET do banco do Bubble */
async function bubbleGet(endpoint, params={}){
  const url = new URL(CONFIG.API_BASE + endpoint);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,typeof v==='object'?JSON.stringify(v):v));
  const res = await fetch(url.toString(), {headers:API_HEADERS});
  if(!res.ok) throw new Error(`Bubble GET ${res.status}`);
  return res.json();
}

/** Carrega códigos já usados para evitar duplicata */
async function carregarCodsUsados(){
  if(!CONFIG.ORC_ID) return;
  try {
    const data = await bubbleGet(CONFIG.OBJ_FERRAGEM, {
      constraints: JSON.stringify([{key:'orc_id',constraint_type:'equals',value:CONFIG.ORC_ID}]),
      fields:'fa_codigo'
    });
    _codsUsados = (data.response?.results||[]).map(r=>r.fa_codigo||'');
  } catch(e){ console.warn('Não foi possível carregar códigos existentes:', e); }
}

/* ══════════════════════════════════════════════════════

══════════════════════════════════════════════════════ */
async function submitFerragem(){
  if(!_elTemp) return;
  const erros = validaEl(_elTemp);
  if(erros.length){ alert('Corrija os erros antes de inserir:\n'+erros.join('\n')); return; }

  const cod   = document.getElementById('popup-cod').value.trim().toUpperCase();

  const ps    = pecas(_elTemp);
  const peso  = ps.reduce((s,p)=>s+p.peso,0);

  const payload = {
    /* ── Referências ─────────────────────────────────────── */
    orc_id         : CONFIG.ORC_ID,
    emp_id         : CONFIG.EMP_ID,
    user_id        : CONFIG.USER_ID,
    eng_grupo_ref  : _grupoId || '',

    /* ── Identificação ───────────────────────────────────── */
    fa_codigo      : cod,
    fa_tipo        : _elTemp.tipo,
    fa_descricao   : resumoEl(_elTemp),

    /* ── Dimensões principais (nomes dos campos do Bubble) ── */
    fa_cm_base_a   : _elTemp.b    || 0,
    fa_cm_altura_a : _elTemp.h    || 0,
    fa_cm_largura_a: _elTemp.L    || 0,
    fa_cob         : _elTemp.cob  || 0,
    fa_D           : _elTemp.D    || 0,

    /* ── Corte e dobra / reta ────────────────────────────── */

    fa_comp_dobra  : _elTemp.anc    || 0,
    fa_bitola_reta_a : String(_elTemp.bitr || _elTemp.estb?.bit || ''),

    /* ── Tela ────────────────────────────────────────────── */
    fa_W           : _elTemp.W  || 0,
    fa_H           : _elTemp.H  || 0,
    fa_modelo_tela : _elTemp.modeloTela || '',

    /* ── Treliça ─────────────────────────────────────────── */
    fa_modelo_tr   : _elTemp.modeloTr || '',

    /* ── Estribos ────────────────────────────────────────── */
    fa_est_bitola  : String(_elTemp.est?.bit || ''),
    fa_est_esp     : _elTemp.est?.esp || 0,

    /* ── Espiral (circular) ──────────────────────────────── */
    fa_esp_bitola  : String(_elTemp.espiral?.bit || ''),
    fa_esp_passo   : _elTemp.espiral?.passo || 0,

    /* ── Quantidade e preço ──────────────────────────────── */
    fa_qcom        : _elTemp.qcom || 1,
    fa_preco_kg    : preco,
    fa_peso_kg     : +peso.toFixed(3),
    fa_total_rs    : +(peso*preco).toFixed(2),

    /* ── Status e projeto ────────────────────────────────── */
    fa_status      : 'Orçado',
    proj_nome      : CONFIG.PROJ_NOME,
    proj_rev       : CONFIG.PROJ_REV,

    /* ── JSON completo para recalcular depois ────────────── */
    dados_json     : JSON.stringify(_elTemp),
  };
  if(_bubbleId) payload.ferragem_bubble_id = _bubbleId;

  const endpoint = _bubbleId ? CONFIG.WF_EDITAR : CONFIG.WF_INSERIR;
  const btnEl    = document.getElementById('btn-inserir');
  btnEl.classList.add('btn-loading');
  btnEl.disabled = true;

  try {
    const res = await bubblePost(endpoint, payload);
    showToast(_bubbleId ? 'Ferragem atualizada!' : 'Ferragem inserida!', 'ok');
    notifyBubble(_bubbleId ? 'ferragem_editada' : 'ferragem_inserida', {

/* ══════════════════════════════════════════════════════
   POPUP — abrir / fechar
══════════════════════════════════════════════════════ */
function openPopup(opts={}){
  _editingId = opts.editId   || null;
  _bubbleId  = opts.bubbleId || null;
  if(opts.codsUsados) _codsUsados = opts.codsUsados;

  document.getElementById('popup-title').textContent =
    _editingId ? `Editar Ferragem — ${_editingId}` : 'Inserir Ferragem Armada';
  document.getElementById('btn-inserir').textContent =
    _editingId ? 'Salvar Alterações' : 'Inserir Ferragem';
  document.getElementById('popup-preco').value = CONFIG.PRECO_KG;

  // Preenche dropdown de tipo
  const sel = document.getElementById('tipo-sel');
  sel.innerHTML = `<option value="">— selecione o tipo de produto —</option>`;
  CATALOGO.forEach(g=>{
    const og=document.createElement('optgroup'); og.label=g.g;
    g.itens.forEach(i=>{
      const o=document.createElement('option');
      o.value=i.tipo; o.textContent=i.tipo+' — '+i.desc;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });

  if(_editingId && opts.dadosJson){
    // Modo edição: carrega dados existentes do Bubble
    try {
      _elTemp = typeof opts.dadosJson==='string' ? JSON.parse(opts.dadosJson) : opts.dadosJson;
      sel.value = _elTemp.tipo;
      document.getElementById('popup-preco').value = _elTemp._precoKg || CONFIG.PRECO_KG;
      document.getElementById('popup-cod').value   = _editingId;
      document.getElementById('popup-body').style.display = '';
      document.getElementById('btn-inserir').disabled = false;
      renderPopupBody();
    } catch(e){ console.error('Erro ao parsear dadosJson:', e); }
  } else {
    _elTemp = null;
    sel.value = '';
    document.getElementById('popup-body').style.display = 'none';
    document.getElementById('btn-inserir').disabled = true;
    document.getElementById('popup-cod').value = '';
    document.getElementById('popup-total').textContent = '—';
  }
  document.getElementById('popupBg').classList.add('open');
}

function closePopup(){
  document.getElementById('popupBg').classList.remove('open');
  _elTemp=null; _editingId=null; _bubbleId=null; _grupoId=null; _grupos=[];
  document.getElementById('popup-grupo-wrap').style.display='none';
  notifyBubble('popup_fechado', {});
}

/* ══════════════════════════════════════════════════════
   POPUP — seleção de tipo
══════════════════════════════════════════════════════ */
function tipoChanged(tipo){
  _grupoId=null; _grupos=[];
  document.getElementById('popup-grupo-wrap').style.display='none';

  if(eng==='viga')    Object.assign(_elTemp,{b:20,h:40,L:400,cob:2.5,longs:[{pos:'Superior',bit:8,q:2,anc:25},{pos:'Inferior',bit:10,q:3,anc:25}],est:{bit:5,esp:15}});
  else if(eng==='pilar')  Object.assign(_elTemp,{b:20,h:20,L:290,cob:2.5,longs:[{pos:'Longitudinal',bit:10,q:4,anc:40}],est:{bit:5,esp:12},qcom:tipo==='Coluna pronta'?10:1});
  else if(eng==='sapata') Object.assign(_elTemp,{b:90,h:90,L:25,cob:4,longs:[{pos:'Malha X',bit:8,q:7,anc:12},{pos:'Malha Y',bit:8,q:7,anc:12}],est:null});
  else if(eng==='circ')   Object.assign(_elTemp,{D:30,L:600,cob:3,longs:[{pos:'Longitudinal',bit:10,q:6,anc:50}],espiral:{bit:5,passo:15}});
  else if(eng==='estribo')Object.assign(_elTemp,{b:12,h:22,cob:0,estb:{bit:4.2},qcom:1000});
  else if(eng==='reta')   Object.assign(_elTemp,{comp:300,dobras:2,anc:20,bitr:10,qcom:100});
  else if(eng==='tela')   Object.assign(_elTemp,{W:245,H:600,modeloTela:'Q-92 (Ø4,2 c/15)',qcom:10});
  else if(eng==='trelica')Object.assign(_elTemp,{modeloTr:'TR 8645',L:800,qcom:100});
  else if(eng==='revenda')Object.assign(_elTemp,{rev:[{prod:'Barra CA-50 12 m',bit:10,q:10}]});

  // Sugere código sem conflito
  const pref=PREF[tipo]||'FA';
  let n=1; while(_codsUsados.includes(pref+n)) n++;
  document.getElementById('popup-cod').value=pref+n;

  document.getElementById('popup-body').style.display='';
  document.getElementById('btn-inserir').disabled=false;
  renderPopupBody();

  // Carrega grupos disponíveis para este tipo (async, não bloqueia UI)
  carregarGrupos(tipo);
}

/* ── Busca grupos padrão do tipo selecionado no Bubble ──────── */
async function carregarGrupos(tipo){
  if(!CONFIG.EMP_ID && !CONFIG.OBJ_GRUPO_FA) return;
  const wrap=document.getElementById('popup-grupo-wrap');
  const sel=document.getElementById('grupo-sel');
  const loading=document.getElementById('grupo-loading');
  loading.style.display='';
  try{
    const constraints=[{key:'Tipo_fa',constraint_type:'equals',value:tipo}];
    if(CONFIG.EMP_ID) constraints.push({key:'0.adm_empresa',constraint_type:'equals',value:CONFIG.EMP_ID});
    const data=await bubbleGet(CONFIG.OBJ_GRUPO_FA,{
      constraints:JSON.stringify(constraints),
      limit:50
    });
    _grupos=data.response?.results||[];
  }catch(e){console.warn('Grupos FA não carregados:',e);}
  loading.style.display='none';
  if(_grupos.length===0) return;
  sel.innerHTML='<option value="">— preencher manualmente —</option>'+
    _grupos.map(g=>{
      const nome=g.nome_grupo||g['Tipo_fa']||'Grupo';
      const bit=g['Bitola']?` · Ø${g['Bitola']}`:'';
      const preco=g['preco-kg']?` · R$${Number(g['preco-kg']).toFixed(2)}/kg`:'';
      return `<option value="${g._id}">${nome}${bit}${preco}</option>`;
    }).join('');
  wrap.style.display='';
}

/* ── Aplica template do grupo selecionado ───────────────────── */
function aplicarGrupo(grupoId){
  _grupoId=grupoId||null;
  if(!grupoId) return;
  const g=_grupos.find(x=>x._id===grupoId);
  if(!g) return;

  // 1. Pre-fill preço/kg do grupo
  if(g['preco-kg']) document.getElementById('popup-preco').value=g['preco-kg'];

  // 2. Se tem JSON de template, carrega dimensões completas
  if(g['fa_dados_template']){
    try{
      const tmpl=typeof g['fa_dados_template']==='string'
        ?JSON.parse(g['fa_dados_template']):g['fa_dados_template'];
      const tipo=_elTemp.tipo;
      _elTemp={...tmpl,tipo,id:'_tmp'};
      renderPopupBody();
      showToast('Grupo aplicado: '+( g.nome_grupo||g['Tipo_fa']),'ok');
      return;
    }catch(e){console.warn('fa_dados_template inválido:',e);}
  }

  // 3. Fallback: só aplica bitola nas longitudinais
  if(g['Bitola']&&_elTemp.longs){
    const bit=parseFloat(g['Bitola']);
    if(!isNaN(bit)&&KGM[bit]) _elTemp.longs.forEach(l=>l.bit=bit);
  }
  renderPopupBody();
  showToast('Preço e bitola do grupo aplicados','ok');
}

      +`<button class="btn ghost sm" style="margin-top:10px" onclick="_elTemp.rev.push({prod:'Arame recozido nº 18',q:10});renderPopupBody()">+ item</button>`;
  }

  document.getElementById('popup-form').innerHTML=form;

  const erros=validaEl(_elTemp);
  document.getElementById('popup-erros').innerHTML=erros.length
    ?`<div class="err-box">${erros.map(e=>`<p>⚠ ${e}</p>`).join('')}</div>`:'';

  const ps=pecas(_elTemp),pesoTotEl=ps.reduce((s,p)=>s+p.peso,0);
  document.getElementById('popup-pecas').innerHTML=`
    <table>
      <tr><th>Peça</th><th>Ø</th><th>Comp.</th><th>Qtd</th><th>Peso</th></tr>
      ${ps.map(p=>`<tr>
        <td class="tag-b">${p.cod}</td>
        <td>${p.bit==='-'?'—':'Ø'+p.bit}</td>
        <td>${p.comp?(p.comp/100).toFixed(2)+' m':'—'}</td>
        <td>${p.q}</td>
        <td><b>${fkg(p.peso)}</b></td>
      </tr>`).join('')}
      <tr style="background:#f0f4f8"><td colspan="4" style="font-weight:700">Total</td><td><b>${fkg(pesoTotEl)}</b></td></tr>
    </table>`;

  desenhaModal();
  atualizaTotal();
}

/* ══════════════════════════════════════════════════════
   SVG — seção transversal
══════════════════════════════════════════════════════ */
function desenhaModal(){
  if(!_elTemp) return;
  const eng=engDe(_elTemp.tipo),el=_elTemp;
  const svg=document.getElementById('secao-modal'); if(!svg)return;
  const altH={viga:270,pilar:270,sapata:270,circ:270,estribo:240,tela:270,trelica:70,reta:40,revenda:40};
  const H=altH[eng]||40,W=260; svg.setAttribute('height',H);

  if(eng==='sapata'||eng==='tela'){
    const bw2=eng==='tela'?el.W:el.b,bh2=eng==='tela'?Math.min(el.H,el.W*1.4):el.h;
    const s=Math.min(200/bw2,200/bh2),bw=bw2*s,bh=bh2*s,x=(W-bw)/2,y=(H-30-bh)/2;
    let g=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${eng==='tela'?'#fff':'#EDF1F5'}" stroke="#1a3a5c" stroke-width="2"/>`;
    const nx=eng==='tela'?9:(el.longs[0]?el.longs[0].q:5),ny=eng==='tela'?7:(el.longs[1]?el.longs[1].q:5);
    const c=eng==='tela'?6:el.cob*s;
    for(let i=0;i<nx;i++){const yy=y+c+(bh-2*c)*i/Math.max(nx-1,1);g+=`<line x1="${x+c}" y1="${yy}" x2="${x+bw-c}" y2="${yy}" stroke="#0E96BC" stroke-width="2"/>`}
    for(let i=0;i<ny;i++){const xx=x+c+(bw-2*c)*i/Math.max(ny-1,1);g+=`<line x1="${xx}" y1="${y+c}" x2="${xx}" y2="${y+bh-c}" stroke="#12bded" stroke-width="2"/>`}
    g+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B7280">${eng==='tela'?'painel soldado (ilustrativo)':'malha '+el.b+'×'+el.h+' cm'}</text>`;
    svg.innerHTML=g; return;
  }
  if(eng==='circ'){
    const R=90,cx=W/2,cy=(H-30)/2+6,c=el.cob/el.D*2*R;
    let g=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#EDF1F5" stroke="#1a3a5c" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${R-c}" fill="none" stroke="#2a7a8c" stroke-width="3" stroke-dasharray="6 4"/>`;
    const n=el.longs[0].q,r=Math.max(4,el.longs[0].bit/2);
    for(let i=0;i<n;i++){const a=i/n*2*Math.PI-Math.PI/2;
      g+=`<circle cx="${(cx+(R-c-r-2)*Math.cos(a)).toFixed(1)}" cy="${(cy+(R-c-r-2)*Math.sin(a)).toFixed(1)}" r="${r}" fill="#0E96BC"/>`}
    g+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B7280">Ø${el.D} cm · ${n} barras · espiral Ø${el.espiral.bit} p/${el.espiral.passo}</text>`;
    svg.innerHTML=g; return;
  }
  if(eng==='estribo'){
    const s=Math.min(170/el.b,190/el.h),bw=el.b*s,bh=el.h*s,x=(W-bw)/2,y=(H-40-bh)/2+8;
    svg.innerHTML=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="none" stroke="#2a7a8c" stroke-width="5"/>
    <line x1="${x+bw*0.18}" y1="${y-2}" x2="${x+bw*0.42}" y2="${y+bh*0.24}" stroke="#2a7a8c" stroke-width="5" stroke-linecap="round"/>
    <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B7280">estribo ${el.b}×${el.h} cm · Ø${el.estb.bit} · gancho 135°</text>`;
    return;
  }
  if(eng==='viga'||eng==='pilar'){
    const s=Math.min(180/el.b,210/el.h),bw=el.b*s,bh=el.h*s,x=(W-bw)/2,y=(H-40-bh)/2+8,c=el.cob*s;
    let g=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="#EDF1F5" stroke="#1a3a5c" stroke-width="2"/>`;
    if(el.est) g+=`<rect x="${x+c}" y="${y+c}" width="${bw-2*c}" height="${bh-2*c}" rx="6" fill="none" stroke="#2a7a8c" stroke-width="3"/>`;
    const sup=el.longs.find(l=>/Sup/i.test(l.pos)),inf=el.longs.find(l=>/Inf/i.test(l.pos)),lon=el.longs.find(l=>/Long/i.test(l.pos));
    const drawBar=(lg,yy)=>{if(!lg)return'';let o='';const r=Math.max(3,lg.bit*s/20);
      for(let i=0;i<lg.q;i++){const xx=lg.q===1?x+bw/2:x+c+r+(bw-2*c-2*r)*i/Math.max(lg.q-1,1);o+=`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${r}" fill="#0E96BC"/>`}return o};
    if(lon){const r=Math.max(3.5,lon.bit*s/20),per=[[x+c+r,y+c+r],[x+bw-c-r,y+c+r],[x+bw-c-r,y+bh-c-r],[x+c+r,y+bh-c-r]];
      for(let i=0;i<lon.q;i++){const p=per[i%4];g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="#0E96BC"/>`}}
    else{g+=drawBar(sup,y+c+5)+drawBar(inf,y+bh-c-5)}
    g+=`<text x="${W/2}" y="${y+bh+22}" text-anchor="middle" font-size="11" fill="#6B7280">${el.b}×${el.h} cm · cob ${el.cob}${el.est?` · Ø${el.est.bit} c/${el.est.esp}`:''}</text>`;
    svg.innerHTML=g; return;
  }
  if(eng==='trelica'){
    const mid=H/2;
    svg.innerHTML=`
      <line x1="20" y1="${mid}" x2="${W-20}" y2="${mid}" stroke="#1a3a5c" stroke-width="4"/>
      <line x1="20" y1="${H*0.2}" x2="${W-20}" y2="${H*0.2}" stroke="#0E96BC" stroke-width="3"/>
      <line x1="20" y1="${H*0.8}" x2="${W-20}" y2="${H*0.8}" stroke="#0E96BC" stroke-width="3"/>
      ${[0,1,2,3,4,5,6,7].map(i=>{const x0=20+i*(W-40)/7,x1=20+(i+1)*(W-40)/7;
        return i%2===0?`<line x1="${x0}" y1="${H*0.2}" x2="${x1}" y2="${H*0.8}" stroke="#2a7a8c" stroke-width="2"/>`:
          `<line x1="${x0}" y1="${H*0.8}" x2="${x1}" y2="${H*0.2}" stroke="#2a7a8c" stroke-width="2"/>`;}).join('')}
      <text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="10" fill="#6B7280">${el.modeloTr} · ${TRELICAS[el.modeloTr]} kg/m</text>`;
    return;
  }
  svg.innerHTML=`<text x="${W/2}" y="25" text-anchor="middle" font-size="12" fill="#9CA3AF">Sem desenho para este tipo</text>`;
}

function atualizaTotal(){
  if(!_elTemp) return;
  const ps=pecas(_elTemp),peso=ps.reduce((s,p)=>s+p.peso,0);
  const preco=+document.getElementById('popup-preco').value||CONFIG.PRECO_KG;
  document.getElementById('popup-total').textContent=R$(peso*preco);
}

/* ══════════════════════════════════════════════════════
   EDIÇÃO DO _elTemp
══════════════════════════════════════════════════════ */
function edT(k,v){if(!_elTemp)return;_elTemp[k]=+v;renderPopupBody();}
function edTstr(k,v){if(!_elTemp)return;_elTemp[k]=v;renderPopupBody();}
function edTl(i,k,v){if(!_elTemp)return;_elTemp.longs[i][k]=+v;renderPopupBody();}
function edTe(k,v){if(!_elTemp)return;_elTemp.est[k]=+v;renderPopupBody();}
function edTe2(obj,k,v){if(!_elTemp)return;_elTemp[obj][k]=+v;renderPopupBody();}
function edTrv(i,k,v){if(!_elTemp)return;const it=_elTemp.rev[i];it[k]=k==='q'||k==='bit'?+v:v;renderPopupBody();}

══════════════════════════════════════════════════════ */
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}

/* ══════════════════════════════════════════════════════
   LISTENER — mensagens do Bubble pai

   Bubble envia:
     { source:'bubble_armatech', action:'open_popup' }
     { source:'bubble_armatech', action:'open_popup_edit',
       editId:'V1', bubbleId:'1234abc', dadosJson:{...} }
     { source:'bubble_armatech', action:'set_config',
       config:{ ORC_ID:'...', EMP_ID:'...', PRECO_KG:9.5 } }
     { source:'bubble_armatech', action:'close_popup' }

   Armatech responde:
     { source:'armatech', event:'armatech_ready', data:{version:'5.0'} }
     { source:'armatech', event:'ferragem_inserida',
       data:{ bubble_id, codigo, tipo, descricao, peso_kg, total_estimado } }
     { source:'armatech', event:'ferragem_editada',
       data:{ bubble_id, codigo, tipo, descricao, peso_kg, total_estimado } }
     { source:'armatech', event:'popup_fechado', data:{} }
══════════════════════════════════════════════════════ */
window.addEventListener('message', async(e)=>{
  const d=e.data;
  if(!d||d.source!=='bubble_armatech') return;
  switch(d.action){
    case 'open_popup':
      await carregarCodsUsados();
      openPopup({codsUsados:_codsUsados});
      break;
    case 'open_popup_edit':
      openPopup({editId:d.editId,bubbleId:d.bubbleId,dadosJson:d.dadosJson});
      break;
    case 'set_config':
      Object.assign(CONFIG,d.config||{});
      if(d.config?.PRECO_KG) document.getElementById('popup-preco').value=CONFIG.PRECO_KG;
      // Filtra bitolas disponíveis para esta empresa
      if(d.config?.BITOLAS){
        const raw = typeof d.config.BITOLAS==='string'
          ? d.config.BITOLAS.split(',').map(b=>parseFloat(b.trim()))
          : d.config.BITOLAS.map(b=>parseFloat(b));
        const validas = raw.filter(b=>KGM[b]);
        if(validas.length>0){ BITS.splice(0,BITS.length,...validas); }
      }
      break;
    case 'close_popup':
      closePopup();
      break;
  }
});

/* ══════════════════════════════════════════════════════
   INIT — lê parâmetros da URL e abre automaticamente
══════════════════════════════════════════════════════ */
(function initFromUrl(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('orc_id'))    CONFIG.ORC_ID    = p.get('orc_id');
  if(p.get('emp_id'))    CONFIG.EMP_ID    = p.get('emp_id');
  if(p.get('user_id'))   CONFIG.USER_ID   = p.get('user_id');
  if(p.get('preco_kg'))  CONFIG.PRECO_KG  = parseFloat(p.get('preco_kg'));
  if(p.get('proj_nome')) CONFIG.PROJ_NOME = p.get('proj_nome');
  if(p.get('bitolas')){
    const raw = p.get('bitolas').split(',').map(b=>parseFloat(b.trim()));
    const validas = raw.filter(b=>KGM[b]);
    if(validas.length>0){ BITS.splice(0,BITS.length,...validas); }
  }
  // Se veio ORC_ID pela URL, abre direto (modo standalone com dados reais)
  if(CONFIG.ORC_ID){
    carregarCodsUsados().then(()=>openPopup({codsUsados:_codsUsados}));
    return;
  }
  // Modo standalone (acesso direto ao link, fora do Bubble): abre popup de demonstração
  if(window.self === window.top){
    openPopup({codsUsados:[]});
    return;
  }
  // Fallback: modo auto_open via CONFIG (dentro de iframe, se configurado)
  if(CONFIG.MODO==='auto_open'){
    carregarCodsUsados().then(()=>openPopup({codsUsados:_codsUsados}));
  }
})();
// Auto-detecta ambiente version-test vs live via referrer
(function(){
  var ref = document.referrer || '';
  var href = window.location.href || '';
  if(ref.includes('version-test') || href.includes('version-test')){
    CONFIG.API_BASE = 'https://app.lajestech.com.br/version-test/api/1.1';
  }
})();

// Se está dentro de um iframe, ativa modo iframe (sem overlay)
if(window.self !== window.top){
  document.body.classList.add('iframe-mode');
}
// Avisa o Bubble que o HTML está carregado e pronto
notifyBubble('armatech_ready',{version:'5.0'});
